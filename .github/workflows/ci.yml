name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: engine, captures and the DNS trap
        run: python -m unittest discover -s tests -v

  windows-live:
    # GitHub's Windows runners are administrators: switch on the DNS Client log and watch real lookups
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: watch reads every lookup and the program behind it
        env:
          PANOPTES_ADMIN_TESTS: "1"
          PYTHONIOENCODING: utf-8
        run: python -m unittest tests.test_live -v
