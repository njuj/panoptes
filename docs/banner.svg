patterns</text><text x="700" y="322" font-size="13" fill="#8b949e">beacons, DGAs, tunnels,</text><text x="700" y="342" font-size="13" fill="#8b949e">RAT certificates, DoH</text></g><path class="flow" d="M950 280.0 H978" stroke="#c77dff" stroke-width="2" fill="none" opacity=".8"/><path d="M972 275.0 l6 5 -6 5" stroke="#c77dff" stroke-width="2" fill="none"/><g class="n" style="animation-delay:1.30s"><rect class="glow" x="984" y="196" width="266" height="168" rx="14" fill="#c77dff" opacity=".18" filter="url(#sh)"/><rect x="984" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#c77dff" stroke-width="2"/><text x="1232" y="226" text-anchor="end" font-size="12" fill="#3d4757">04</text><g transform="translate(1004 216) scale(1.6)" fill="none" stroke="#c77dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="3"/></g><text x="1004" y="294" font-size="17" font-weight="700" fill="#f0f3f6">DNS trap</text><text x="1004" y="322" font-size="13" fill="#8b949e">ApateDNS-style sinkhole</text><text x="1004" y="342" font-size="13" fill="#8b949e">for lab samples</text></g><g class="n" style="animation-delay:1.8s"><rect x="72" y="378" width="151" height="28" rx="14" fill="none" stroke="#c77dff" stroke-opacity=".5"/><text x="148" y="397" text-anchor="middle" font-size="12.5" fill="#c77dff">zero dependencies</text></g><g class="n" style="animation-delay:1.8s"><rect x="233.2" y="378" width="174" height="28" rx="14" fill="none" stroke="#c77dff" stroke-opacity=".5"/><text x="320" y="397" text-anchor="middle" font-size="12.5" fill="#c77dff">reads TLS handshakes</text></g><g class="n" style="animation-delay:1.8s"><rect x="417.2" y="378" width="83" height="28" rx="14" fill="none" stroke="#c77dff" stroke-opacity=".5"/><text x="459" y="397" text-anchor="middle" font-size="12.5" fill="#c77dff">28 tests</text></g><rect x=".5" y=".5" width="1279" height="439" rx="18" fill="none" stroke