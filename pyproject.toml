[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes-dns"
dynamic = ["version"]
description = "See every DNS lookup and outbound connection and the program behind it, and which ones look like malware: C2 beacons, DGAs, DNS tunneling and exfiltration, RAT ports, dynamic DNS. A DNS trap like ApateDNS, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["dns", "malware-analysis", "threat-hunting", "c2", "dga", "dns-tunneling", "exfiltration", "blue-team", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/panoptes"

[project.scripts]
panoptes = "panoptes.cli:main"

[tool.setuptools.dynamic]
version = { attr = "panoptes.__version__" }

[tool.setuptools.packages.find]
include = ["panoptes*"]

